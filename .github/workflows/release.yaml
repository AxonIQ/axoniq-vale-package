name: release

on:
  push:
    tags:
      - 'v.*'

permissions:
  contents: write

jobs:
  build_release:
    name: build_release
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Archive content
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'axoniq-vale-package.zip'
          exclusions: '*.git* *.github*'
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: Auto release for tag ${{ github.ref_name }}
          files: axoniq-vale-package.zip
